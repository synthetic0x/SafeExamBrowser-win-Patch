name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - uses: microsoft/setup-msbuild@v2

      - name: restore
        run: nuget restore SafeExamBrowser.sln -NonInteractive

      - name: build
        shell: pwsh
        run: |
          $solutionDir = (Get-Location).Path + "\"
          $projects = @(
            "SafeExamBrowser.Runtime/SafeExamBrowser.Runtime.csproj",
            "SafeExamBrowser.Client/SafeExamBrowser.Client.csproj",
            "SafeExamBrowser.Service/SafeExamBrowser.Service.csproj",
            "SafeExamBrowser.ResetUtility/SafeExamBrowser.ResetUtility.csproj",
            "SebWindowsConfig/SebWindowsConfig.csproj"
          )

          foreach ($project in $projects) {
            Write-Host "building $project"
            msbuild $project /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$solutionDir" /m /v:minimal
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: wixtoolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: installer
        shell: pwsh
        run: |
          $solutionDir = (Get-Location).Path + "\"
          msbuild Setup/Setup.wixproj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$solutionDir" /m /v:minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: portable
        shell: pwsh
        run: |
          Compress-Archive -Path "SafeExamBrowser.Runtime/bin/x64/Release/*" -DestinationPath "seb-portable-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: seb-installer-x64
          path: Setup/bin/x64/Release/*.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: seb-portable-x64
          path: seb-portable-x64.zip
          if-no-files-found: error
